<title>Pesantren FPS Ringan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<style>
  /* Versi ringan: satu kanvas penuh layar, HUD minimal. Tampilan tetap gelap/terang mengikuti dunia 3D, bukan tema. */
  :root { --hud: rgba(20, 14, 12, .6); --accent: #C8102E; color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { background: #DCE6EE; font: 500 13px system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .x { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; }
  .x::before, .x::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  .x::before { left: 7px; width: 2px; height: 16px; } .x::after { top: 7px; height: 2px; width: 16px; }
  #prompt { position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%); background: var(--hud); padding: 5px 12px; border-radius: 8px; font-weight: 700; pointer-events: none; white-space: nowrap; }
  #help { position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--hud); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15, 10, 8, .55); cursor: pointer; z-index: 3; }
  #start div { background: var(--accent); padding: 14px 26px; border-radius: 999px; font-size: 17px; font-weight: 700; }
  #joy { display: none; position: fixed; left: calc(env(safe-area-inset-left, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 92px; height: 92px; border-radius: 50%; background: rgba(255, 255, 255, .2); border: 2px solid rgba(255, 255, 255, .55); touch-action: none; }
  #knob { position: absolute; left: 25px; top: 25px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, .9); pointer-events: none; }
  #acts { display: none; position: fixed; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); gap: 12px; align-items: flex-end; }
  #acts button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #fff; background: rgba(255, 255, 255, .85); color: #231A17; font: 700 13px system-ui, sans-serif; touch-action: none; }
  #acts #jump { background: var(--accent); color: #fff; border-color: var(--accent); }
  #acts button:disabled { opacity: .35; }
  body.touch #joy { display: block; } body.touch #acts { display: flex; } body.touch #help { display: none; }
</style>

}
const doorSpecs = [];  // [hingeX, hingeZ, axis, dir, width]

// Dinding sejajar sumbu dengan bukaan pintu {at, w, leaf}
function wall(x0, z0, x1, z1, H, c, ops = [], t = 0.2) {

  let cur = 0;
  ops.sort((p, q) => p.at - q.at).forEach(o => {
    const w = o.w || 1, a = o.at - w / 2, b = o.at + w / 2;
    seg(cur, a, 0, H); seg(a, b, 2.2, H - 2.2);
    if (o.leaf !== false) {

      for (let i = 0; i < n; i++) {

        doorSpecs.push([ax ? x0 + s : x0, ax ? z0 : z0 + s, ax ? 'x' : 'z', dir, lw - 0.02]);

  });

}
// Bangunan: 4 dinding, jendela tempel, atap datar
function building(x0, z0, x1, z1, H, c, ops = {}, skip = '') {
  const sides = { N: [x0, z0, x1, z0], S: [x0, z1, x1, z1], W: [x0, z0, x0, z1], E: [x1, z0, x1, z1] };
  for (const k in sides) {
    if (skip.includes(k)) continue;
    const o = (ops[k] || []).map(v => typeof v === 'number' ? { at: v } : v);
    wall(...sides[k], H, c, o);
    // jendela: panel kaca tempel di sisi luar, tidak menghalangi
    const [a0, b0, a1, b1] = sides[k], ax = k === 'N' || k === 'S', L = ax ? a1 - a0 : b1 - b0;
    const out = k === 'N' || k === 'W' ? -0.12 : 0.12;
    for (let fl = 0; fl < Math.round(H / 3.6); fl++) for (let s = 2; s < L - 1.5; s += 3.2) {
      if (o.some(p => Math.abs(p.at - s) < (p.w || 1) / 2 + 0.9)) continue;
      ax ? B(a0 + s, 1 + fl * 3.6, b0 + out, 1.2, 1.2, 0.04, 0x33495A, false) : B(a0 + out, 1 + fl * 3.6, b0 + s, 0.04, 1.2, 1.2, 0x33495A, false);
    }
  }
  B((x0 + x1) / 2, H, (z0 + z1) / 2, x1 - x0 + 0.6, 0.3, z1 - z0 + 0.6, new THREE.Color(c).multiplyScalar(0.75).getHex());
}

// isi sederhana
const IN = 0xEFE7DA;
// asrama: koridor timur + 5 kamar berisi ranjang susun & loker
wall(17.8, 19, 17.8, 79.3, 3.4, IN, [{ at: 9.25, w: 3, leaf: false }, ...[0, 1, 2, 3, 4].map(r => ({ at: 30.5 + r * 9.76 + 8.9 - 19, leaf: false }))], 0.12);
for (const z of [26, 30.5, 40.26, 50.02, 59.78, 69.54]) wall(2, z, 17.8, z, 3.4, IN, [], 0.12);

const scene = new THREE.Scene();

// satu InstancedMesh per warna

const byColor = new Map();

// kubah, puncak menara, daun pohon
const dome = new THREE.Mesh(new THREE.SphereGeometry(5.2, 20, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xD9A92C));

const cone = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.6, 8), mat(0xD9A92C)); cone.position.set(43.9 + OX, 17.8, 25.4 + OZ); scene.add(cone);
const leaves = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.5, 0), mat(0x4E7D3A), trees.length);

  const pivot = new THREE.Group(); pivot.position.set(hx + OX, 0, hz + OZ);
  const leaf = new THREE.Mesh(leafGeo, doorMat); leaf.scale.x = w;
  if (axis === 'x') leaf.position.set(dir * w / 2, 1.09, 0); else { leaf.rotation.y = Math.PI / 2; leaf.position.set(0, 1.09, dir * w / 2); }

const tmpBox = new THREE.Box3();

// ================= FISIKA =================
const CELL = 2, grid = new Map(), key = (x, z) => (x + 500) * 1000 + (z + 500);
solids.forEach(b => {
  for (let x = Math.floor(b.x0 / CELL); x <= Math.floor(b.x1 / CELL); x++)
    for (let z = Math.floor(b.z0 / CELL); z <= Math.floor(b.z1 / CELL); z++) (grid.get(key(x, z)) || grid.set(key(x, z), []).get(key(x, z))).push(b);
});
const near = [], found = new Set();
function query(x, z, r) {
  near.length = 0; found.clear();
  for (let gx = Math.floor((x - r) / CELL); gx <= Math.floor((x + r) / CELL); gx++)
    for (let gz = Math.floor((z - r) / CELL); gz <= Math.floor((z + r) / CELL); gz++)
      for (const b of grid.get(key(gx, gz)) || []) if (!found.has(b)) { found.add(b); near.push(b); }
  for (const d of doors) if (Math.abs(d.pivot.position.x - x) < 3 && Math.abs(d.pivot.position.z - z) < 3) near.push(d.box);
  return near;
}
const R = 0.3, HEIGHT = 1.75, EYE = 1.6, STEP = 0.35, GRAV = 22, JUMP = 7, WALK = 3.4, RUN = 6.5;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pos = new THREE.Vector3(30 + OX, 0, 6 + OZ), vel = new THREE.Vector3();
let vy = 0, grounded = false, coyote = 0, yaw = Math.PI, pitch = 0, jumpReq = false, bob = 0;

function pushOut() {
  for (const b of query(pos.x, pos.z, R)) {
    if (b.y1 <= pos.y + STEP || b.y0 >= pos.y + HEIGHT) continue;
    const dx = pos.x - clamp(pos.x, b.x0, b.x1), dz = pos.z - clamp(pos.z, b.z0, b.z1), d2 = dx * dx + dz * dz;
    if (d2 >= R * R) continue;
    if (d2 > 1e-10) { const d = Math.sqrt(d2), k = (R - d) / d; pos.x += dx * k; pos.z += dz * k; }
    else {
      const o = [[b.x0 - R - pos.x, 0], [b.x1 + R - pos.x, 0], [0, b.z0 - R - pos.z], [0, b.z1 + R - pos.z]].sort((a, c) => Math.abs(a[0] + a[1]) - Math.abs(c[0] + c[1]))[0];
      pos.x += o[0]; pos.z += o[1];
    }
  }
}
function under(b, r) { const dx = pos.x - clamp(pos.x, b.x0, b.x1), dz = pos.z - clamp(pos.z, b.z0, b.z1); return dx * dx + dz * dz < r * r; }
function groundAt(maxY) { let g = 0; for (const b of query(pos.x, pos.z, R)) if (b.y1 <= maxY && b.y1 > g && under(b, R * 0.8)) g = b.y1; return g; }
function ceilAt() { let c = 1e9; for (const b of query(pos.x, pos.z, R)) if (b.y0 >= pos.y + STEP && b.y0 < c && under(b, R * 0.9)) c = b.y0; return c; }
function solidAt(x, y, z) {
  for (const b of grid.get(key(Math.floor(x / CELL), Math.floor(z / CELL))) || []) if (x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1 && z > b.z0 && z < b.z1) return true;
  return false;
}

// ================= INPUT =================
const keys = new Set(), joy = { id: null, x: 0, y: 0 };
let look = null, locked = false, noLock = false, started = false;
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) document.body.classList.add('touch');
const canvas = renderer.domElement, $ = id => document.getElementById(id);

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'Space') jumpReq = true;
  if (e.code === 'KeyE') toggle(target);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

function lockMouse() {
  if (touch || noLock) return;
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => { noLock = true; }); } catch { noLock = true; }
}
document.addEventListener('pointerlockerror', () => { noLock = true; });
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; });
$('start').addEventListener('click', () => {
  $('start').hidden = true; started = true;
  const el = document.documentElement;
  try { const p = el.requestFullscreen && el.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch {}
  lockMouse();
});
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || noLock) { look = look || { id: e.pointerId, x: e.clientX, y: e.clientY }; return; }
  if (locked) toggle(target); else lockMouse();
});
addEventListener('pointermove', e => {
  if (locked && e.pointerType === 'mouse') { turn(e.movementX, e.movementY, 0.0022); return; }
  if (look && e.pointerId === look.id) { turn(e.clientX - look.x, e.clientY - look.y, touch ? 0.006 : 0.004); look.x = e.clientX; look.y = e.clientY; }
});
const endLook = e => { if (look && e.pointerId === look.id) look = null; };
addEventListener('pointerup', endLook); addEventListener('pointercancel', endLook);
function turn(dx, dy, k) { yaw -= dx * k; pitch = clamp(pitch - dy * k, -1.45, 1.45); }

const joyEl = $('joy'), knob = $('knob');
function joyMove(e) {
  const r = joyEl.getBoundingClientRect(), m = r.width / 2;
  let dx = e.clientX - r.left - m, dy = e.clientY - r.top - m;
  const d = Math.hypot(dx, dy); if (d > m) { dx *= m / d; dy *= m / d; }
  joy.x = dx / m; joy.y = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); jumpReq = true; });
$('door').addEventListener('pointerdown', e => { e.preventDefault(); toggle(target); });

// ================= PINTU =================
const ray = new THREE.Raycaster(); ray.far = 2.8;
const leaves3 = doors.map(d => d.leaf), dir = new THREE.Vector3(), eye = new THREE.Vector3();
let target = null;
function findDoor() {
  eye.set(pos.x, pos.y + EYE, pos.z);
  dir.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  ray.set(eye, dir);
  const hit = ray.intersectObjects(leaves3, false)[0];
  if (!hit) return null;
  for (let t = 0.2; t < hit.distance - 0.15; t += 0.15) if (solidAt(eye.x + dir.x * t, eye.y + dir.y * t, eye.z + dir.z * t)) return null;
  return doors[leaves3.indexOf(hit.object)];
}
function toggle(d) {
  if (!d) return;
  if (d.target) { d.target = 0; return; }
  const p = d.pivot.position, away = d.axis === 'x' ? Math.sign(p.z - pos.z) || 1 : Math.sign(p.x - pos.x) || 1;
  d.target = (d.axis === 'x' ? -away : away) * d.dir * Math.PI / 2;
}

// ================= LOOP =================
function step(dt) {
  for (const d of doors) if (d.angle !== d.target) {
    const s = 3.5 * dt, diff = d.target - d.angle;
    d.angle = Math.abs(diff) <= s ? d.target : d.angle + Math.sign(diff) * s;
    d.pivot.rotation.y = d.angle; d.pivot.updateMatrixWorld(true); doorBox(d);
  }
  let f = 0, s = 0, run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  if (keys.has('KeyW') || keys.has('ArrowUp')) f++;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f--;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s++;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) s--;
  let mag = Math.min(1, Math.hypot(f, s));
  if (joy.id !== null) { f = -joy.y; s = joy.x; mag = Math.min(1, Math.hypot(f, s)); run = mag > 0.92; }
  let mx = -Math.sin(yaw) * f + Math.cos(yaw) * s, mz = -Math.cos(yaw) * f - Math.sin(yaw) * s;
  const len = Math.hypot(mx, mz); if (len) { mx *= mag / len; mz *= mag / len; }
  const sp = run ? RUN : WALK, k = 1 - Math.exp(-(grounded ? 14 : 3) * dt);
  vel.x += (mx * sp - vel.x) * k; vel.z += (mz * sp - vel.z) * k;
  const n = Math.max(1, Math.ceil(Math.hypot(vel.x, vel.z) * dt / 0.12));
  for (let i = 0; i < n; i++) { pos.x += vel.x * dt / n; pos.z += vel.z * dt / n; pushOut(); }

  if (jumpReq && (grounded || coyote > 0)) { vy = JUMP; grounded = false; coyote = 0; }
  jumpReq = false;
  vy -= GRAV * dt;
  let ny = pos.y + vy * dt;
  const g = groundAt(pos.y + (grounded ? STEP : 0.05));
  if (vy <= 0 && ny <= g) { ny = g; vy = 0; grounded = true; }
  else if (grounded && vy <= 0 && pos.y - g < STEP) { ny = g; vy = 0; }
  else grounded = false;
  if (vy > 0) { const c = ceilAt(); if (ny + HEIGHT > c) { ny = c - HEIGHT; vy = 0; } }
  pos.y = ny; coyote = grounded ? 0.12 : coyote - dt;

  const moving = Math.hypot(vel.x, vel.z);
  bob = grounded && moving > 0.5 ? bob + dt * moving * 2.6 : bob * 0.9;
  cam.position.set(pos.x, pos.y + EYE + Math.sin(bob * 2) * 0.03, pos.z);
  cam.rotation.set(pitch, yaw, 0);
}

let uiT = 0;
const prompt = $('prompt'), doorBtn = $('door');
const clock = new THREE.Clock();
function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  if ((uiT -= dt) <= 0) {
    uiT = 0.12;
    target = findDoor();
    const msg = target ? (target.target ? 'Tutup pintu' : 'Buka pintu') : '';
    prompt.hidden = !msg; prompt.textContent = touch ? msg : 'E · ' + msg;
    doorBtn.disabled = !target; doorBtn.textContent = target && target.target ? 'Tutup' : 'Buka';
  }
  renderer.render(scene, cam);
});
</script>
