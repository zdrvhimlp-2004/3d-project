<title>Tapak 3D Layar Penuh</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<style>
  /* Layout: kanvas 3D memenuhi 100% lebar × 100% tinggi layar, kontrol melayang di atasnya */
  :root {
    --scene: #EFE6DA;
    --chip: rgba(255, 255, 255, .92);
    --chip-fg: #231A17;
    --chip-on: #231A17;
    --chip-on-fg: #FBF7F1;
    --line: #E6DCD0;
    --font: "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --scene: #241B18; --chip: rgba(33, 25, 22, .92); --chip-fg: #F3EAE2; --chip-on: #F3EAE2; --chip-on-fg: #17110F; --line: #3A2D28; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --scene: #241B18; --chip: rgba(33, 25, 22, .92); --chip-fg: #F3EAE2; --chip-on: #F3EAE2; --chip-on-fg: #17110F; --line: #3A2D28; color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--scene); font-family: var(--font); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; cursor: zoom-in; }
  #scene.full { cursor: grab; }
  #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 2; }
  .bar button {
    pointer-events: auto; font: 500 13px var(--font); color: var(--chip-fg); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
  .bar button:focus-visible { outline: 2px solid #C8102E; outline-offset: 2px; }
  .hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
    font: 500 13px var(--font); color: var(--chip-fg); background: var(--chip); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap; z-index: 2;
  }
  .label {
    font: 700 12px/1.2 var(--font); color: #fff; text-align: center; background: rgba(28, 16, 14, .78);
    padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none;
  }
  .label small { display: block; font-weight: 400; opacity: .85; }
  .hide-labels .label { display: none; }
</style>

<div id="scene"></div>
<div class="bar">
  <button id="mode-out" aria-pressed="true">Tampak Luar</button>
  <button id="mode-1" aria-pressed="false">Interior Lt.1</button>
  <button id="mode-2" aria-pressed="false">Interior Lt.2</button>
  <button id="btn-top">Tampak Atas</button>
  <button id="btn-3d">Perspektif</button>
  <button id="btn-full">Layar Penuh</button>
</div>
<div class="hint" id="hint">Memuat model…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { buildSite, SITE_W, SITE_D } from './model.js';

const host = document.getElementById('scene');
const hint = document.getElementById('hint');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
host.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const applyThemeBg = () => { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()); };
applyThemeBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyThemeBg);
new MutationObserver(applyThemeBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(40, 1, 0.2, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 3;
controls.maxDistance = 260;

scene.add(new THREE.HemisphereLight(0xfff6ea, 0x8a7a6a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-40, 80, -30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 250 });
scene.add(sun);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xCFC3AE, roughness: 1 }));
outer.rotation.x = -Math.PI / 2; outer.position.y = -0.06; outer.receiveShadow = true;
scene.add(outer);

// Gabungkan mesh per material agar ringan dirender layar penuh.
function mergeGroup(g) {
  g.updateMatrixWorld(true);
  const inv = g.matrixWorld.clone().invert(), buckets = new Map();
  g.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    geo.deleteAttribute('uv');
    geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    if (!buckets.has(o.material)) buckets.set(o.material, []);
    buckets.get(o.material).push(geo);
  });
  const out = new THREE.Group();
  out.position.copy(g.position); out.rotation.copy(g.rotation); out.userData = { ...g.userData };
  for (const [mat, geos] of buckets) {
    const mesh = new THREE.Mesh(mergeGeometries(geos), mat);
    mesh.castShadow = !mat.transparent; mesh.receiveShadow = true;
    out.add(mesh);
  }
  return out;
}
function viewCopy(src) {
  if (src.userData.merge) return mergeGroup(src);
  const c = new THREE.Group();
  c.position.copy(src.position); c.rotation.copy(src.rotation); c.userData = { ...src.userData };
  src.children.forEach(ch => c.add(viewCopy(ch)));
  return c;
}
const { site, meta, gateLabel } = buildSite();
site.position.set(-SITE_W / 2, 0, -SITE_D / 2);
const view = viewCopy(site);
scene.add(view);

const roofs = [], upper = [];
view.traverse(o => {
  if (o.userData.part === 'roof') roofs.push(o);
  if (o.userData.floor >= 1) upper.push(o);
});
function makeLabel(title, sub) {
  const el = document.createElement('div');
  el.className = 'label'; el.textContent = title;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; el.appendChild(s); }
  return new CSS2DObject(el);
}
meta.forEach(it => { if (it.label) { const l = makeLabel(it.name, it.area.toLocaleString('id-ID') + ' m²'); l.position.fromArray(it.label); view.add(l); } });
const gl = makeLabel('Gerbang Utama'); gl.position.fromArray(gateLabel); view.add(gl);

// Mode & kamera
function setMode(mode) {
  roofs.forEach(r => { r.visible = mode === 'out'; });
  upper.forEach(u => { u.visible = mode !== 1; });
  host.classList.toggle('hide-labels', mode !== 'out');
  [['out', 'mode-out'], [1, 'mode-1'], [2, 'mode-2']].forEach(([k, id]) => document.getElementById(id).setAttribute('aria-pressed', String(k === mode)));
}
function setView(kind) {
  if (kind === 'top') { camera.position.set(0, 140, 0.01); controls.target.set(0, 0, 0); }
  else { camera.position.set(35, 75, 115); controls.target.set(0, 0, 2); }
}
document.getElementById('mode-out').onclick = () => setMode('out');
document.getElementById('mode-1').onclick = () => setMode(1);
document.getElementById('mode-2').onclick = () => setMode(2);
document.getElementById('btn-top').onclick = () => setView('top');
document.getElementById('btn-3d').onclick = () => setView('3d');
setView('3d');

// Layar penuh: klik kanvas (tanpa menyeret) langsung masuk layar penuh.
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
async function enterFull() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else throw new Error('unsupported');
  } catch {
    hint.textContent = 'Layar penuh tidak didukung di tampilan ini. Buka fullscreen.html langsung di browser.';
  }
}
function exitFull() {
  if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function syncFull() {
  const on = isFull();
  host.classList.toggle('full', on);
  document.getElementById('btn-full').textContent = on ? 'Keluar Layar Penuh' : 'Layar Penuh';
  hint.textContent = on ? 'Seret untuk memutar · scroll/cubit untuk zoom · Esc untuk keluar' : 'Klik model untuk layar penuh';
}
document.addEventListener('fullscreenchange', syncFull);
document.addEventListener('webkitfullscreenchange', syncFull);
document.getElementById('btn-full').onclick = () => (isFull() ? exitFull() : enterFull());

let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  const moved = !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5;
  downAt = null;
  if (!moved && !isFull()) enterFull();
});
syncFull();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
